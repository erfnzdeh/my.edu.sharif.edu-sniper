name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build every target
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/sniper_${os}_${arch}"
            if [ "$os" = windows ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$out" ./cmd/sniper
          done
          cd dist && sha256sum -- * > SHA256SUMS

      # A tag is the only thing GitHub will hang a release off, so a manual
      # run is a dry run: it proves the matrix still builds and leaves the
      # binaries on the run page, without inventing a tag to publish under.
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload the dry run binaries
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: sniper-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
